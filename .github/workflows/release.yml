# Tag a version and the zip that gets uploaded to extensions.gnome.org is
# attached to the release, built from the same sources as the tag.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ZIP: nowplaying@epogonii.github.io.shell-extension.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install glib-compile-schemas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: The tag and metadata.json must agree
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python3 -c 'import json; print(json.load(open("metadata.json"))["version-name"])')
          if [ "$want" != "$have" ]; then
            echo "tag says $want, metadata.json says $have"
            exit 1
          fi

      - name: The schema must compile
        run: glib-compile-schemas --strict --dry-run schemas

      - name: Build the zip
        run: |
          python3 tools/gen-stylesheets.py
          zip -r "$ZIP" \
            metadata.json extension.js prefs.js stylesheet.css \
            stylesheet-light.css stylesheet-dark.css LICENSE \
            schemas/org.gnome.shell.extensions.nowplaying.gschema.xml

      # The changelog section for this version becomes the release notes; if
      # there is none, let GitHub write them from the commits.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {take = 1; next} /^## / {take = 0} take' \
            CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --notes-file notes.md "$ZIP"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes "$ZIP"
          fi
